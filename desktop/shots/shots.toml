# The screenshots `cargo run -p finance-shots --release` takes, in order.
# Each is the web app on the demo household (?demo=1), framed.
#
#   name      the file: <out>/<name>.png
#   page      overview, spending, budgets, travel, transactions, review,
#             subscriptions, cashflow, investments, banks, crypto, broker,
#             categories, settings, doctor
#   tab       investments: overview holdings contributions income habits allocation
#             broker: monitoring deep; categories: rules suggest; spending: home;
#             settings: general account data home sync
#   size      desktop (1440x900 @2x, default), wide (1680x1050 @2x), phone (390x844 @3x);
#             tall (1440x2400 @1x) and phone-tall (390x1800 @2x) show a whole long page, for checking
#   mode      dark (default) or light
#   palette   warm (default), nord, catppuccin, gruvbox, tokyo-night, rose-pine, terminal
#   hover     pin the line charts' readout at this fraction of their width
#   map_hover pin the travel map's readout on this stop
#   keys      false: hide the keyboard hints (default: shown on desktop sizes)
#   query     more of the page's query (key=value&...), e.g. "month=2026-08"
#   frame     window (default), phone (default for size = "phone") or none
#   backdrop  warm paper nord frost mocha latte tokyo rose dawn gruvbox terminal
#             (default: the palette's, in its mode)
#   pair      true: the other mode too, the two split diagonally

[[shot]]
name = "overview-dark"
page = "overview"

[[shot]]
name = "overview-light"
page = "overview"
mode = "light"

[[shot]]
name = "overview-split"
page = "overview"
pair = true
keys = false

[[shot]]
name = "spending"
page = "spending"
palette = "nord"

[[shot]]
name = "spending-home"
page = "spending"
tab = "home"
palette = "nord"

[[shot]]
name = "travel"
page = "travel"
palette = "catppuccin"
map_hover = 2
keys = false

[[shot]]
name = "investments-jkb"
page = "investments"
tab = "habits"
hover = 0.62

[[shot]]
