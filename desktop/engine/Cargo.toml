[package]
name = "finance-engine"
version = "0.1.0"
edition.workspace = true
publish.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "The finance server's engine: store, file parsers + ingest, categorization, valuation views, exchange/broker/price fetchers. UI-free and HTTP-free."

[dependencies]
anyhow = "1"
# the portable archive (archive.rs): age (scrypt passphrase or X25519
# recipients) around a zstd tar
age = "0.12"
base64 = "0.23"
# the secrets store (secrets.rs): XChaCha20-Poly1305 + the OS CSPRNG
chacha20poly1305 = "0.11"
chrono = { version = "0.4", default-features = false, features = ["std", "clock"] }
calamine = { version = "0.37", features = ["dates"] }
# the SMS regex (core::paste), shared with the web build's pasted-text check
finance-core = { path = "../core", default-features = false }
hex = "0.4"
getrandom = "0.4"
hmac = "0.13"
md-5 = "0.11"
quick-xml = "0.42"
regex = "1"
rusqlite = { version = "0.40", features = ["bundled", "backup", "serialize"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
sha2 = "0.11"
tar = { version = "0.4", default-features = false }
toml = "1"
ureq = "3"
zstd = { version = "0.14", default-features = false }

[features]
# counters for the server's warm-start tests; off in production
test-hooks = []

[dev-dependencies]
# tests write .xlsx files to read back
rust_xlsxwriter = { version = "0.100", default-features = false }
