# Attach linux binaries and the web app to a GitHub Release on a v* tag.
# anser-server aarch64 is cross-compiled on ubuntu-22.04 (glibc 2.35) so it
# runs on Raspberry Pi OS bookworm (glibc 2.36). Native arm runners are
# paid on a private repo.
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing git tag to release (v*)'
        required: true
        type: string

concurrency:
  group: release-${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  CARGO_NET_RETRY: 10
  FINANCE_VERSION: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}

defaults:
  run:
    working-directory: desktop

jobs:
  prepare:
    name: Tag
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      version: ${{ env.FINANCE_VERSION }}
    steps:
      - name: Tag matches v*
        working-directory: .
        run: |
          case "$FINANCE_VERSION" in
            v*) echo "releasing $FINANCE_VERSION" ;;
            *) echo "tag must match v* (got $FINANCE_VERSION)" >&2; exit 1 ;;
          esac

  server:
    name: anser-server (${{ matrix.suffix }})
    needs: prepare
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - suffix: x86_64-linux
            target: x86_64-unknown-linux-gnu
          - suffix: aarch64-linux
            target: aarch64-unknown-linux-gnu
    env:
      # unused on the x86_64 row; cc/ring/zstd-sys/libsqlite3-sys read these
      # when --target is aarch64 (bundled C, no system libzstd/openssl)
      CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: aarch64-linux-gnu-gcc
      CC_aarch64_unknown_linux_gnu: aarch64-linux-gnu-gcc
      AR_aarch64_unknown_linux_gnu: aarch64-linux-gnu-ar
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          ref: ${{ env.FINANCE_VERSION }}
      - name: aarch64 cross toolchain
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        working-directory: .
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends gcc-aarch64-linux-gnu libc6-dev-arm64-cross
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: desktop
          key: release-${{ matrix.target }}
      - name: Build anser-server
        run: cargo build --release --locked -p finance-server --bin anser-server --target ${{ matrix.target }}
      - name: Pack
        working-directory: .
        run: |
          bin="desktop/target/${{ matrix.target }}/release/anser-server"
          test -x "$bin"
          file "$bin"
          mkdir -p dist
          tar -I "xz -9 -T0" -cf "dist/anser-server-${{ matrix.suffix }}.tar.xz" -C "$(dirname "$bin")" anser-server -C "$PWD" LICENSE THIRD_PARTY_NOTICES.md
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: anser-server-${{ matrix.suffix }}
          path: dist/anser-server-${{ matrix.suffix }}.tar.xz
          if-no-files-found: error

  desktop:
    name: anser (x86_64-linux)
    needs: prepare
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Free disk space (toolchains this build doesn't use)
        working-directory: .
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL /usr/share/swift
          sudo docker image prune --all --force >/dev/null 2>&1 || true
          df -h /
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          ref: ${{ env.FINANCE_VERSION }}
      - name: System libraries (GPUI, keyring)
        working-directory: .
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev \
            libvulkan-dev libfontconfig-dev libfreetype-dev libx11-xcb-dev \
            libxcb1-dev libxcb-xkb-dev libasound2-dev libdbus-1-dev libssl-dev \
            libzstd-dev poppler-utils
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: desktop
          key: release-desktop
      - name: Build anser
        run: cargo build --release --locked -p finance-desktop --bin anser
      - name: Pack
        working-directory: .
        run: |
          bin=desktop/target/release/anser
          test -x "$bin"
          file "$bin"
          mkdir -p dist
          tar -I "xz -9 -T0" -cf "dist/anser-x86_64-linux.tar.xz" -C "$(dirname "$bin")" anser -C "$PWD" LICENSE THIRD_PARTY_NOTICES.md
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: anser-x86_64-linux
          path: dist/anser-x86_64-linux.tar.xz
          if-no-files-found: error
      - name: Disk left
        if: always()
        working-directory: .
        run: df -h /

  web:
    name: Web app
    needs: prepare
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Free disk space (toolchains this build doesn't use)
        working-directory: .
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL /usr/share/swift
          sudo docker image prune --all --force >/dev/null 2>&1 || true
          df -h /
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          ref: ${{ env.FINANCE_VERSION }}
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: desktop
          key: wasm-release
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.cargo/bin/wasm-bindgen
          key: wasm-bindgen-${{ runner.os }}-${{ hashFiles('desktop/Cargo.lock') }}
      - name: wasm-bindgen-cli (Cargo.lock version)
        run: |
          want=$(grep -A1 '^name = "wasm-bindgen"$' Cargo.lock | sed -n 's/^version = "\(.*\)"/\1/p' | head -1)
          have=$(wasm-bindgen --version 2>/dev/null | awk '{print $2}' || true)
          if [[ "$have" != "$want" ]]; then
            cargo install wasm-bindgen-cli --version "$want" --locked
          fi
      - name: Build the web app
        run: scripts/build-web.sh
      - name: Pack
        working-directory: .
        run: |
          out=desktop/target/webapp
          test -f "$out/index.html"
          test -f "$out/finance_web.js"
          test -f "$out/finance_web_bg.wasm"
          mkdir -p dist
          tar -I "xz -9 -T0" -cf "dist/anser-web.tar.xz" -C "$out" . -C "$PWD" LICENSE THIRD_PARTY_NOTICES.md -C desktop/web/fonts OFL.txt LICENSE-DejaVu.txt LICENSE.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: finance-web
          path: dist/anser-web.tar.xz
          if-no-files-found: error
      - name: Disk left
        if: always()
        working-directory: .
        run: df -h /

  release:
    name: GitHub Release
    needs: [prepare, server, desktop, web]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: dist
          merge-multiple: true
      - name: SHA256SUMS
        working-directory: dist
        run: |
          ls -l
          test "$(ls -1 *.tar.xz | wc -l)" -eq 4
          sha256sum *.tar.xz | tee SHA256SUMS
      - uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          tag_name: ${{ env.FINANCE_VERSION }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: dist/*
